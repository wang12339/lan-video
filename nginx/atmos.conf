# ── Atmos Video — nginx TLS reverse proxy configuration ─────────
# HTTPS termination for the Rust backend.
# Certificates are generated with mkcert (see certs/ directory).
#
# Usage:
#   1. Generate certs: cd nginx && mkcert -cert-file certs/cert.pem -key-file certs/key.pem \
#        localhost 192.168.*.x your-domain.com
#   2. docker compose up -d
#
# For production, replace with Let's Encrypt certs.

upstream atmos_backend {
    server backend:8082;
}

# ── HTTPS server (production) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS certificates
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Modern TLS config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Max upload size (matches backend's DefaultBodyLimit::disable())
    client_max_body_size 0;

    # ── API proxy ──
    location / {
        proxy_pass http://atmos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Support long-running uploads
        proxy_request_buffering off;
    }

    # ── Media files ──
    location /media/ {
        proxy_pass http://atmos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache media files
        proxy_cache atmos_cache;
        proxy_cache_valid 200 30m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_proxied any;
}

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # For LAN use, redirect is optional — comment out if you want direct HTTP access
    location / {
        return 301 https://$host$request_uri;
    }
}

# Cache zone for media
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=atmos_cache:10m max_size=1g inactive=60m use_temp_path=off;
