# atmos-video Nginx 站点配置。
# 本文件需 include 在 http{} 上下文内（如 /etc/nginx/conf.d/atmos.conf）。
#
# 重要：
# - 后端所有路由都没有 /api 前缀（/auth/login、/videos、/admin/...、/chat/...、
#   /media/...、/ws/chat、/health，见 backend/src/app.rs），本配置整站按原路径
#   代理，不做任何 rewrite。
# - /media 由后端 media_auth 中间件保护（会话/分享令牌、防盗链、带宽限速），
#   必须代理到后端，禁止 alias 静态目录（会绕过鉴权）。
# - 占位符需在部署时替换：${DOMAIN} → 真实域名；/etc/nginx/ssl/{cert,key,chain}.pem
#   → 真实证书/私钥/CA 链，否则 nginx -t/启动会失败。

# 默认按宿主机部署（docker-compose 将 app 端口绑定到 127.0.0.1:8082）。
# 若 nginx 与 app 在同一个 compose 网络内，把地址改为 app:8082。
upstream atmos_backend {
    server 127.0.0.1:8082;
    keepalive 32;
}

# 全局限流 zone（配置中引用了这些 zone，缺失会导致 nginx 启动失败）。
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# WebSocket（/ws/chat）升级映射：非升级请求 Connection 置空，保证 upstream keepalive 可用。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    # ── TLS ──
    # 占位路径：部署时替换为真实文件。chain.pem 必须是签发者的完整 CA 链
    # （含中间证书），OCSP stapling 依赖它；若暂时拿不到 CA 链，可删除
    # ssl_trusted_certificate 并关闭下列两条 ssl_stapling 指令。
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
    # OCSP stapling 需要解析 OCSP 响应器域名
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 100M;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── 前端静态资源 ──
    # 可选：直接由 nginx 服务 SPA 构建产物（后端也能服务 /webapp）。
    # 用 root 而非 alias：嵌套的 regex location 需要可继承的 root 才能正确
    # 解析路径（alias 不随嵌套 location 继承）。
    location /webapp/ {
        root /var/lib/atmos;
        try_files $uri $uri/ /webapp/index.html;

        location ~* \.(?:css|js|woff2?|ttf|eot|ico|svg|gif|jpe?g|png|webp|avif)$ {
            # 本层出现 add_header 后，server 级安全头不再被继承，必须重复声明，
            # 否则静态资源响应会丢失 HSTS/X-Frame-Options 等安全头。
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            # 不使用 expires，避免与 add_header 产生重复的 Cache-Control 头
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            # 缺失的 hash 资源直接 404，避免回退到 SPA shell 返回 HTML（后端行为一致）
            try_files $uri =404;
        }
    }

    # ── 上传端点限流 ──
    # 后端真实上传路由（backend/src/app.rs）：
    #   POST /admin/videos/upload（整文件，超时 2h）
    #   POST /admin/videos/upload-resume（分片续传，32MB/片）
    #   POST /chat/image、POST /chat/video（聊天媒体）
    #   POST /auth/user/avatar（头像）
    # 用精确匹配避免限流误伤普通接口；普通接口在 location / 走 zone=api。

    location = /admin/videos/upload {
        limit_req zone=upload burst=10 nodelay;
        # 后端 security_headers 已下发同名头；这里以上层 nginx 值为准，
        # 隐藏后端重复项，避免出现两个冲突的 X-Frame-Options/Referrer-Policy。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://atmos_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    location = /admin/videos/upload-resume {
        # 分片续传为连续小请求，burst 放宽避免高带宽下 503
        limit_req zone=upload burst=20 nodelay;
        # 后端 security_headers 已下发同名头；这里以上层 nginx 值为准，
        # 隐藏后端重复项，避免出现两个冲突的 X-Frame-Options/Referrer-Policy。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://atmos_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /chat/image {
        limit_req zone=upload burst=10 nodelay;
        # 后端 security_headers 已下发同名头；这里以上层 nginx 值为准，
        # 隐藏后端重复项，避免出现两个冲突的 X-Frame-Options/Referrer-Policy。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://atmos_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /chat/video {
        limit_req zone=upload burst=10 nodelay;
        # 后端 security_headers 已下发同名头；这里以上层 nginx 值为准，
        # 隐藏后端重复项，避免出现两个冲突的 X-Frame-Options/Referrer-Policy。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://atmos_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /auth/user/avatar {
        limit_req zone=upload burst=10 nodelay;
        # 后端 security_headers 已下发同名头；这里以上层 nginx 值为准，
        # 隐藏后端重复项，避免出现两个冲突的 X-Frame-Options/Referrer-Policy。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://atmos_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 聊天 WebSocket（长连接，不能套普通 120s 超时）──
    location /ws/ {
        proxy_pass http://atmos_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 媒体文件 ──
    # 必须代理到后端以复用 media_auth（令牌/分享令牌/防盗链/限速）。
    # 本 location 刻意不写 add_header：一旦出现 add_header，server 级安全头
    # 将不再被继承；缓存策略保持后端返回的 Cache-Control（private, no-cache）。
    # 如需在此改写响应头，请用 proxy_hide_header/proxy_set_header 并自行补齐
    # 上述 5 个安全头。
    location /media/ {
        # 后端 security_headers 已下发同名头；这里以上层 nginx 值为准，
        # 隐藏后端重复项，避免出现两个冲突的 X-Frame-Options/Referrer-Policy。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://atmos_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 视频/图片流式传输，关闭缓冲降低首字节延迟
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── 其余全部代理到后端（后端自带业务限流，zone=api 作为边缘兜底）──
    location / {
        limit_req zone=api burst=50 nodelay;
        limit_conn addr 20;
        # 后端 security_headers 已下发同名头；这里以上层 nginx 值为准，
        # 隐藏后端重复项，避免出现两个冲突的 X-Frame-Options/Referrer-Policy。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://atmos_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
