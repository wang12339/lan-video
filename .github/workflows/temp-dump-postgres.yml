name: temp-dump-postgres

# 临时工具 workflow：在海外 runner 上拉取 postgres 镜像并推送到 GHCR，
# 供 ECS 服务器从 ghcr.io 快速拉取（ECS 直连 docker hub/mirror 对该镜像不稳定）。
# 用途完成后可删除此文件。

on:
  workflow_dispatch:

jobs:
  push:
    name: Push postgres to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Pull, tag, push to GHCR
        run: |
          docker pull postgres:16-alpine
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag postgres:16-alpine ghcr.io/wang12339/lan-video:postgres-16-alpine
          docker push ghcr.io/wang12339/lan-video:postgres-16-alpine
          echo "pushed OK"
