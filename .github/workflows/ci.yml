# Atmos CI/CD Pipeline
# Triggers: push to main + PRs
# Jobs: backend (Rust) + frontend (React/Vite)

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Backend: Rust build + test ───────────────────────────────
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lan_video
          POSTGRES_PASSWORD: lan_video
          POSTGRES_DB: lan_video
        options: >-
          --health-cmd pg_isready -U lan_video
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --check

      - name: Clippy
        working-directory: ./backend
        run: cargo clippy -- -D warnings

      - name: Build
        working-directory: ./backend
        run: cargo build --release

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://lan_video:lan_video@localhost:5432/lan_video
        run: cargo test

  # ─── Security audit ──────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        working-directory: ./backend
        run: cargo audit

  # ─── Frontend: TypeScript + Vite build ────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: ./webapp
        run: npm ci

      - name: TypeScript check
        working-directory: ./webapp
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ./webapp
        run: npm test

      - name: Build
        working-directory: ./webapp
        run: npm run build
