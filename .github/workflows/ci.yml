# atmos-android CI/CD Pipeline
# Triggers: push to main + PRs, produces APK artifacts + Docker images

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  # ─── Backend: Rust build + test ───────────────────────────────
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lan_video
          POSTGRES_PASSWORD: lan_video
          POSTGRES_DB: lan_video
        options: >-
          --health-cmd pg_isready -U lan_video
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --check

      - name: Clippy
        working-directory: ./backend
        run: cargo clippy -- -D warnings

      - name: Build
        working-directory: ./backend
        run: cargo build --release

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://lan_video:lan_video@localhost:5432/lan_video
        run: cargo test

  # ─── Android: Build + test ────────────────────────────────────
  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK + run tests
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atmos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ─── Release: Signed APK (tags only) ──────────────────────────
  release:
    name: Release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Create keystore.properties
        run: |
          cat > app/keystore.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: atmos-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
