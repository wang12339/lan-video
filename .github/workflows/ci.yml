# Atmos CI/CD Pipeline
# 顺序（与 AGENTS.md 约定一致）：fmt → clippy → build → test
# 后端含 DB 集成测试（postgres service 容器）；前端跑 tsc + vitest + build
# 另有: 安全审计(cargo-audit / cargo-deny) 与 Docker 镜像构建验证
# 新增: 代码覆盖率检查、增强安全审计、Docker 构建与推送、自动部署

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 后端: fmt → clippy → build → test（含 DB 集成测试）─────────────
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atmos_video
          POSTGRES_PASSWORD: atmos_video
          POSTGRES_DB: atmos_video
        options: >-
          --health-cmd "pg_isready -U atmos_video -d atmos_video"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 缓存 registry + 各 profile 的 target（debug 供 clippy/test，release 供 build）
      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --check

      - name: Clippy
        working-directory: ./backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: ./backend
        run: cargo build --release --locked

      # DB 集成测试: build_router 会先应用 migrations；--test-threads=1
      # 串行执行避免测试间在共享库上互相干扰（见 AGENTS.md）
      - name: Run tests (incl. DB integration)
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://atmos_video:atmos_video@localhost:5432/atmos_video
        run: cargo test --locked -- --test-threads=1

      # 代码覆盖率收集（仅 main 分支）
      - name: Install cargo-llvm-cov
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://atmos_video:atmos_video@localhost:5432/atmos_video
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: backend/lcov.info
          fail_ci_if_error: false
          verbose: true

  # ─── 前端: tsc 类型检查 + vitest + 构建 ────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: ./webapp
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        working-directory: ./webapp
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ./webapp
        run: npm test

      - name: Build
        working-directory: ./webapp
        run: npm run build

  # ─── 依赖漏洞审计 (cargo-audit) ─────────────────────────────────────
  audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # 缓存可复用已编译的 cargo-audit（避免每次全量安装）
      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        working-directory: ./backend
        run: cargo audit

  # ─── 前端安全审计 (npm audit) ─────────────────────────────────────
  frontend-audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        working-directory: ./webapp
        run: npm ci --no-audit --no-fund
      - name: Run npm audit
        working-directory: ./webapp
        run: npm audit --audit-level=high

  # ─── 容器镜像扫描 (Trivy) ─────────────────────────────────────────
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'atmos-video:ci'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ─── 许可证/依赖策略 (cargo-deny, 使用 backend/deny.toml) ──────────
  deny:
    name: License Policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: embarkstudios/cargo-deny-action@v2
        with:
          working-directory: ./backend

  # ─── Docker 镜像构建验证（多阶段 Dockerfile + .dockerignore）────────
  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # 不推送，仅验证镜像能成功构建（gha cache 加速重复构建）
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: atmos-video:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 冒烟验证: 无 DB 时 init_pool 会重试约 7.5s 后 panic —— 若进程在
      # 该窗口内提前退出，说明配置/环境变量解析失败（如 PUBLIC_URL panic）
      - name: Smoke test (config parse)
        run: |
          docker run -d --name atmos-ci \
            -e DATABASE_URL=postgres://x:x@localhost:5432/x \
            -e PUBLIC_URL=http://localhost:8082 \
            -e APP_ENV=development \
            -e COOKIE_SECURE=false \
            atmos-video:ci
          sleep 6
          if [ "$(docker inspect --format='{{.State.Status}}' atmos-ci)" != "running" ]; then
            echo "::error::容器在 DB 重试窗口内退出 — 配置/环境变量解析失败?"
            docker logs atmos-ci
            docker rm -f atmos-ci
            exit 1
          fi
          echo "OK: 进程存活且配置解析通过（无 PUBLIC_URL panic），进入 DB 重试"
          docker logs atmos-ci 2>&1 | tail -3
          docker rm -f atmos-ci

      # 保存镜像供后续 job 使用
      - name: Save Docker image
        run: docker save atmos-video:ci | gzip > /tmp/atmos-video-ci.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/atmos-video-ci.tar.gz
          retention-days: 3

  docker-publish:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend, frontend, audit, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker-publish, container-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://atmos-video.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/atmos-video
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            docker compose down
            docker compose up -d
            docker system prune -f
