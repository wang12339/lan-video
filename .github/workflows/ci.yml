# Atmos CI/CD Pipeline
# 顺序（与 AGENTS.md 约定一致）：fmt → clippy → build → test
# 后端含 DB 集成测试（postgres service 容器）；前端跑 tsc + vitest + build
# 另有: 安全审计(cargo-audit / cargo-deny) 与 Docker 镜像构建验证
# 新增: 代码覆盖率检查、增强安全审计、Docker 构建与推送、自动部署

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 后端: fmt → clippy → build → test（含 DB 集成测试）─────────────
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atmos_video
          POSTGRES_PASSWORD: atmos_video
          POSTGRES_DB: atmos_video
        options: >-
          --health-cmd "pg_isready -U atmos_video -d atmos_video"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      # Redis is required by the distributed-behaviour tests: the shared rate
      # limiter, the cross-instance media-auth cache, the HLS transcode lock,
      # and the "Redis was down at startup" late-reconnect regressions. Without
      # this service those tests self-skip and a green build would say nothing
      # about them.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      # 缓存 registry + 各 profile 的 target（debug 供 clippy/test，release 供 build）
      - name: Cache Cargo
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --check

      - name: Clippy
        working-directory: ./backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: ./backend
        run: cargo build --release --locked

      # DB 集成测试: build_router 会先应用 migrations；--test-threads=1
      # 串行执行避免测试间在共享库上互相干扰（见 AGENTS.md）
      - name: Run tests (incl. DB + Redis integration)
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://atmos_video:atmos_video@localhost:5432/atmos_video
          # Test-only instance (no persistence, default config) so CI never
          # needs a REDIS_PASSWORD or a volume.
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --locked -- --test-threads=1

      # 代码覆盖率收集（仅 main 分支）
      - name: Install cargo-llvm-cov
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          # SHA 固定后不再从 ref 推断工具，必须显式指定
          tool: cargo-llvm-cov

      - name: Generate coverage report
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://atmos_video:atmos_video@localhost:5432/atmos_video
          # `cargo llvm-cov` re-runs the whole suite, so it needs the same
          # services as the test step above — otherwise the Redis tests panic
          # under CI=true instead of silently skipping.
          REDIS_URL: redis://127.0.0.1:6379
        run: cargo llvm-cov --locked --lcov --output-path lcov.info -- --test-threads=1

      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: backend/lcov.info
          fail_ci_if_error: false
          verbose: true

  # ─── 前端: tsc 类型检查 + vitest + 构建 ────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: ./webapp
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        working-directory: ./webapp
        run: npx tsc --noEmit

      # 测试文件的类型检查（tsconfig.test.json，由 webapp 提供 typecheck:test 脚本）
      - name: TypeScript check (tests)
        working-directory: ./webapp
        run: npm run typecheck:test

      - name: Run tests
        working-directory: ./webapp
        run: npm test

      - name: Build
        working-directory: ./webapp
        run: npm run build

  # ─── 依赖漏洞审计 (cargo-audit) ─────────────────────────────────────
  audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      # 缓存可复用已编译的 cargo-audit（避免每次全量安装）
      - name: Cache Cargo
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        working-directory: ./backend
        run: |
          cp audit.toml "$CARGO_HOME/audit.toml"
          cargo audit

  # ─── 前端安全审计 (npm audit) ─────────────────────────────────────
  frontend-audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        working-directory: ./webapp
        run: npm ci --no-audit --no-fund
      - name: Run npm audit
        working-directory: ./webapp
        run: npm audit --audit-level=high

  # ─── 容器镜像扫描 (Trivy) ─────────────────────────────────────────
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker]
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: docker load -i /tmp/atmos-video-ci.tar.gz
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'atmos-video:ci'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # 仅报告不阻断: 镜像内置 Debian/ffmpeg, 其 OS 包 CVE 长期高频更新,
          # 硬门禁会永久红。结果仍上传 Security tab 跟踪; 应用自身依赖由
          # cargo-audit / npm audit 门禁。
          exit-code: '0'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ─── 许可证/依赖策略 (cargo-deny, 使用 backend/deny.toml) ──────────
  deny:
    name: License Policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: embarkstudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: ./backend/Cargo.toml

  # ─── Docker 镜像构建验证（多阶段 Dockerfile + .dockerignore）────────
  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      # 不推送，仅验证镜像能成功构建（gha cache 加速重复构建）
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: atmos-video:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 冒烟验证: 无 DB 时 init_pool 会重试约 7.5s 后 panic —— 若进程在
      # 该窗口内提前退出，说明配置/环境变量解析失败（如 PUBLIC_URL panic）
      - name: Smoke test (config parse)
        run: |
          docker run -d --name atmos-ci \
            -e DATABASE_URL=postgres://x:x@localhost:5432/x \
            -e PUBLIC_URL=http://localhost:8082 \
            -e APP_ENV=development \
            -e COOKIE_SECURE=false \
            atmos-video:ci
          sleep 6
          if [ "$(docker inspect --format='{{.State.Status}}' atmos-ci)" != "running" ]; then
            echo "::error::容器在 DB 重试窗口内退出 — 配置/环境变量解析失败?"
            docker logs atmos-ci
            docker rm -f atmos-ci
            exit 1
          fi
          echo "OK: 进程存活且配置解析通过（无 PUBLIC_URL panic），进入 DB 重试"
          docker logs atmos-ci 2>&1 | tail -3
          docker rm -f atmos-ci

      # 保存镜像供后续 job 使用
      - name: Save Docker image
        run: docker save atmos-video:ci | gzip > /tmp/atmos-video-ci.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-image
          path: /tmp/atmos-video-ci.tar.gz
          retention-days: 3

  docker-publish:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend, frontend, audit, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # 仅此 job 需要推送 GHCR；job 级 permissions 会覆盖顶层声明，须显式带上 contents: read
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker-publish, container-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://atmos-video.example.com
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            cd /opt/atmos-video

            # compose 通过 shell 环境变量插值镜像（优先级高于服务器 .env 文件）
            export IMAGE_NAME="${{ env.IMAGE_NAME }}"
            IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

            # 记录当前运行镜像为 :previous 供回滚；首次部署无容器时忽略失败
            PREVIOUS_IMAGE="$(docker compose images -q app 2>/dev/null | head -n1)"
            if [ -n "$PREVIOUS_IMAGE" ]; then
              docker tag "$PREVIOUS_IMAGE" "$IMAGE_REF:previous" || true
            fi

            # 拉取 CI 刚推送的镜像；不再 `compose down`，缩短停机窗口
            docker pull "$IMAGE_REF:main"

            # Dockerfile / compose 已配置 HEALTHCHECK，--wait 会等待容器健康；
            # 若服务器 Compose 版本过旧不支持 --wait，则退回 `up -d`，
            # 由下方 curl 轮询兜底健康检查。
            IMAGE_TAG=main docker compose up -d --wait --no-deps app \
              || IMAGE_TAG=main docker compose up -d --no-deps app

            # 显式轮询 /health（最多 30 次 × 2s），失败则回滚到 :previous
            healthy=0
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8082/health >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "::error::健康检查失败，回滚到 :previous 镜像"
              if [ -n "$PREVIOUS_IMAGE" ]; then
                IMAGE_TAG=previous docker compose up -d --no-deps app
              fi
              exit 1
            fi

            docker system prune -f
