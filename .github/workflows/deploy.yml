name: Deploy

# Disabled: 此工作流在 runner 本地构建镜像但从未推送, 服务器上的
# `docker compose pull` 拉不到任何镜像; 部署统一走 ci.yml 的 deploy
# 任务 (GHCR + DEPLOY_* secrets)。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image
        run: docker build -t atmos-video .
      - name: Deploy to server
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/atmos-video
            docker compose pull
            docker compose up -d
