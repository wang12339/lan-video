[package]
name = "lan-video-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit", "set-header", "timeout", "compression-gzip", "compression-br"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
moka = { version = "0.12", features = ["sync"] }
dashmap = "6"
rand = "0.8"
infer = "0.19"
sha2 = "0.10"
hex = "0.4"
sentry = { version = "0.34", features = ["anyhow", "tracing"], default-features = false }
prometheus = "0.13"
anyhow = "1.0"
ammonia = "4.0"

[profile.release]
lto = true
codegen-units = 1
