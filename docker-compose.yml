version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: atmos_video
      POSTGRES_USER: atmos
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://atmos:${DB_PASSWORD}@postgres/atmos_video
      REDIS_URL: redis://redis:6379
      APP_ENV: production
      PUBLIC_URL: ${PUBLIC_URL}
      WEBAPP_ROOT: /var/lib/atmos/webapp
      MEDIA_ROOT: /var/lib/atmos/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media_data:/var/lib/atmos/media
      - ./logs:/var/log/atmos

volumes:
  postgres_data:
  media_data:
