# Atmos Video 本地部署（docker compose）
#
# 用法:
#   docker compose up -d --build      # 启动（默认口令见下方注释）
#   POSTGRES_PASSWORD=xxx docker compose up -d --build   # 自定义 DB 口令
#
# 注意: 应用启动必需 PUBLIC_URL（config.rs 中未设置会 panic）。

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kuaile
      # 本地开发默认口令；生产请务必通过环境变量覆盖:
      #   POSTGRES_PASSWORD=强口令 docker compose up -d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atmos_video}
      POSTGRES_DB: atmos_video
    ports:
      # 仅绑定回环地址，避免对局域网暴露无保护端口。
      # 如本机 5432 已被 brew postgres 占用，可用 DB_PORT=5433 docker compose up 覆盖
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuaile -d atmos_video"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  app:
    build: .
    ports:
      - "8082:8082"
    environment:
      # ── 数据库（口令与 db 服务保持一致）──
      DATABASE_URL: postgres://kuaile:${POSTGRES_PASSWORD:-atmos_video}@db:5432/atmos_video
      # ── 必填：外部访问地址（分享链接/防盗链/HTTPS 跳转用）──
      # 生产环境务必覆盖: PUBLIC_URL=https://your-domain.com docker compose up -d
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8082}
      # development 关闭 HTTPS 强制跳转；生产设为 production
      APP_ENV: ${APP_ENV:-development}
      # 本地 HTTP 开发需关闭 Secure cookie，否则登录态无法回传
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 默认关闭注册（先由管理员建号）
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      RUST_LOG: ${RUST_LOG:-info}
      # 运行时路径（容器内绝对路径，避免依赖 CWD）
      MEDIA_ROOT: /app/media
      WEBAPP_ROOT: /app/webapp/dist
      LOG_DIR: /app/logs
      DATA_DIR: /app/data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    # 安全加固：只读根文件系统 + 禁止提权
    read_only: true
    tmpfs:
      - /app/logs
      - /app/data
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  pgdata:
  media_data:
