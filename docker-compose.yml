version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kuaile
      POSTGRES_DB: lan_video
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuaile"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://kuaile@db:5432/lan_video
      RUST_LOG: info
      APP_ENV: ${APP_ENV:-development}
      REGISTRATION_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media

volumes:
  pgdata:
  media_data:
