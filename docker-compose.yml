services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atmos_video
      POSTGRES_USER: atmos
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atmos -d atmos_video"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    # 服务器部署使用 CI 推送至 GHCR 的镜像（docker compose pull 后 up 即用）；
    # 本地开发保留 build，可 IMAGE_TAG=local docker compose up --build 使用。
    image: ghcr.io/${IMAGE_NAME:-atmos-video}:${IMAGE_TAG:-main}
    build: .
    ports:
      # 仅绑定回环地址：明文流量必须经宿主机 Nginx 终止 TLS 并限流/鉴权
      # （见 nginx/nginx.conf），直接暴露 8082 会绕过反代防护。
      - "127.0.0.1:8082:8082"
    environment:
      DATABASE_URL: postgres://atmos:${DB_PASSWORD}@postgres/atmos_video
      REDIS_URL: redis://redis:6379
      APP_ENV: production
      PUBLIC_URL: ${PUBLIC_URL}
      WEBAPP_ROOT: /var/lib/atmos/webapp
      MEDIA_ROOT: /var/lib/atmos/media
      # 生产必填（≥32 字符随机值）：见 .env.example / backend/.env.example
      HASHID_SALT: ${HASHID_SALT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/var/lib/atmos/media
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped
    # 镜像自带 HEALTHCHECK（curl /health，见 Dockerfile）；此处保留以兼容
    # 老 Docker/Compose 版本，值保持一致。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
  media_data:
  redis_data:

networks:
  backend:
    driver: bridge
