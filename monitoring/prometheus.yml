global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 需要后端配置 METRICS_TOKEN，并把同一令牌写入下面的 credentials_file。
  # 未配置令牌时 /metrics* 返回 404；令牌不匹配返回 401。
  - job_name: "atmos-video"
    static_configs:
      - targets: ["app:8082"]
    metrics_path: "/metrics/prometheus"
    scheme: "http"
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "atmos-video"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "postgres"

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "redis"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
    scrape_interval: 30s
    scrape_timeout: 10s
