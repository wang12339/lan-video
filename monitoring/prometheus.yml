global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 已禁用：/metrics 与 /metrics/prometheus 在 backend/src/app.rs 的
  # internal_routes 中要求管理员 Bearer 鉴权（admin_auth + bearer_auth），
  # 后端目前没有面向 Prometheus 的只读 metrics token 机制，静态抓取必然 401。
  # 如后续实现 metrics 专用凭据，再取消以下注释并配置 authorization。
  # - job_name: "atmos-video"
  #   static_configs:
  #     - targets: ["app:8082"]
  #   metrics_path: "/metrics"
  #   scrape_interval: 10s
  #   scrape_timeout: 5s
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance
  #       replacement: "atmos-video"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "postgres"

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "redis"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
    scrape_interval: 30s
    scrape_timeout: 10s
